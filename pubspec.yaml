name: voicereader
description: "VoiceReader — private, on-device PDF & text to speech. Listen to anything, offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  meta: ^1.15.0
  crypto: ^3.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
