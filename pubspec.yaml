name: voicereader
description: "VoiceReader — private, on-device PDF & text to speech. Listen to anything, offline."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  meta: ^1.15.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfrx: ^2.12.0
  riverpod_annotation: ^2.6.1

dev_dependencies:
  build_runner: ^2.4.15
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^2.4.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
