name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    name: Analyze · Test · Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (pinned via .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner) — skipped until drift/freezed land
        run: |
          echo "Skipping build_runner — no generators in Phase 1/2 (will enable in Phase 2 with drift)"

      - name: Format check
        run: dart format . --output=none --set-exit-if-changed
        continue-on-error: true

      - name: Analyze (fatal infos)
        run: |
          set +e
          output=$(flutter analyze --no-pub --fatal-infos 2>&1)
          code=$?
          echo "$output"
          echo "$output" | grep -E '^\s*(error|warning|info|hint)\s*•' | while IFS= read -r line; do
            lvl=$(printf '%s' "$line" | sed -E 's/^\s*(error|warning|info|hint).*/\1/')
            msg=$(printf '%s' "$line" | sed -E 's/^\s*(error|warning|info|hint)\s*•\s*([^•]+)\s*•.*/\2/')
            loc=$(printf '%s' "$line" | sed -n -E 's/.*•\s*([^•]+):[0-9]+:[0-9]+\s*•.*/\1/p')
            ln=$(printf '%s' "$line" | sed -n -E 's/.*:([0-9]+):[0-9]+\s*•.*/\1/p')
            rule=$(printf '%s' "$line" | sed -n -E 's/.*•\s*([a-z_]+)\s*$/\1/p')
            file=$(printf '%s' "$loc" | sed -E 's#^/home/runner/work/[^/]+/[^/]+/##')
            case "$lvl" in
              error) cmd=error ;;
              warning) cmd=warning ;;
              *) cmd=notice ;;
            esac
            printf '::%s file=%s,line=%s::%s (%s)\n' "$cmd" "$file" "${ln:-1}" "${msg:-analyze}" "${rule:-analyze}"
          done
          exit $code

      - name: Unit & widget tests with coverage
        run: flutter test --coverage --test-randomize-ordering-seed=random

      - name: Coverage gate (domain+core ≥ 60% — Phase 2 target 80%)
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::warning::No coverage file — skipping gate"
            exit 0
          fi
          COVERED=$(grep -c "^DA:" coverage/lcov.info || true)
          MISSED=$(grep -c "^DA:.*,0" coverage/lcov.info || true)
          TOTAL=$COVERED
          if [ "$TOTAL" -eq 0 ]; then echo "No DA records"; exit 0; fi
          HIT=$((TOTAL - MISSED))
          PCT=$((HIT * 100 / TOTAL))
          echo "Coverage: $HIT/$TOTAL = ${PCT}%"
          echo "pct=$PCT" >> "$GITHUB_ENV"
          if [ "$PCT" -lt 30 ]; then
            echo "::error::Coverage ${PCT}% < 30% — too low"
            exit 1
          elif [ "$PCT" -lt 60 ]; then
            echo "::warning::Coverage ${PCT}% < 60% — Phase 2 target is 80%"
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build debug APK
        run: flutter build apk --debug --verbose

      - name: Verify APK exists
        run: |
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          du -h build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voicereader-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  build-check:
    name: Build report
    runs-on: ubuntu-latest
    needs: analyze-test-build
    if: always()
    steps:
      - name: Report
        run: |
          echo "### CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flutter SDK pinned via .fvmrc 3.47.9" >> "$GITHUB_STEP_SUMMARY"
          echo "- Analyze: fatal-infos" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: random order + coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: debug build + artifact 7-day retention" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "If APK is 60-80 MB and coverage artifact exists, pipeline is green." >> "$GITHUB_STEP_SUMMARY"
