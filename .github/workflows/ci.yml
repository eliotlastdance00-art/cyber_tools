name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  analyze-test-build:
    name: Analyze · Test · Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (pinned via .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format check
        run: dart format . --output=none --set-exit-if-changed

      - name: Analyze (fatal infos)
        run: flutter analyze --fatal-infos

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      # The debug APK build proves the Android scaffold (Gradle 9.3.1 / AGP
      # 9.1.0) actually works. First run also injects gradlew + wrapper jar.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voicereader-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
