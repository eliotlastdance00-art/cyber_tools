name: Release

# Two ways to run this:
#   1) Push a tag `v*`  → builds AAB (Play) + installable APK, attaches both to a
#      GitHub Release (draft) and keeps them as workflow artifacts.
#   2) Actions → Release → "Run workflow" (workflow_dispatch) → same artifacts,
#      no tag needed. This is the fastest way to get an APK onto a phone for a
#      smoke test.
#
# Why both an AAB *and* an APK: an .aab can NOT be installed on a phone by hand
# (it is a Play upload format only). Before this, the only hand-installable
# build was the CI debug APK buried inside a 66 MB artifact zip — the most
# common reason a "downloaded app" refuses to open. See docs/INSTALL_TK.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional artifact name suffix (e.g. smoke1)'
        required: false
        default: ''
      build_mode:
        description: 'Build mode'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appbundle:
    name: Build release AAB + installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed only by the "publish GitHub Release" step
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (pinned via .fvmrc)
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Cache pub & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: release-${{ runner.os }}-

      - name: Pub get
        run: flutter pub get

      - name: Generate code
        run: |
          if grep -q "build_runner" pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs || echo "::warning::build_runner skipped"
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --test-randomize-ordering-seed=random

      # Release builds are signed with an upload keystore stored as GitHub
      # secrets — NEVER commit it. Until the secrets exist the release build is
      # debug-signed, which is fine for internal/smoke testing but NOT for Play.
      #   1) keytool -genkey -v -keystore voicereader-upload.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload
      #   2) Secrets: ANDROID_KEYSTORE_B64 (base64 -w0 jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      #   3) uncomment the two steps below + the signing config in android/app/build.gradle.kts
      #
      # - name: Decode upload keystore
      #   run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/voicereader-upload.jks
      #   env: { ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }} }
      # - name: Write key.properties
      #   run: printf 'storeFile=voicereader-upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      #   env: { KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}, KEY_ALIAS: ${{ secrets.KEY_ALIAS }}, KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }} }

      - name: Build App Bundle (Play upload format)
        if: inputs.build_mode != 'debug'
        run: flutter build appbundle --release --verbose

      - name: Build APK (hand-installable on a phone)
        run: |
          if [ "${{ inputs.build_mode }}" = "debug" ]; then
            flutter build apk --debug --verbose
            mkdir -p build/app/outputs/flutter-apk/
            # copy debug as VoiceReader for consistency
            cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-release.apk || true
          else
            flutter build apk --release --verbose
            flutter build apk --debug --verbose || true
          fi

      - name: Name artifacts with version + commit + metadata
        run: |
          set -euo pipefail
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BASE="voicereader-${VER}-${GITHUB_SHA::7}"
          SUF="${{ github.event.inputs.version_suffix }}"
          if [ -n "$SUF" ]; then BASE="${BASE}-${SUF}"; fi
          ARTIFACT=$(printf '%s' "$BASE" | tr '/' '-')
          mkdir -p dist
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/${BASE}.aab"
          fi
          # ONE friendly filename for humans: this is the file people must tap on
          # their phone. The .aab is Play-only and deliberately named so.
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "dist/VoiceReader.apk"
            cp build/app/outputs/flutter-apk/app-release.apk "dist/${BASE}.apk"
          fi
          if [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk "dist/${BASE}-debug.apk" || true
          fi
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          echo "ARTIFACT_NAME=${ARTIFACT}" >> "$GITHUB_ENV"
          ls -lh dist
          cat dist/SHA256SUMS.txt
          # Build info for traceability
          {
            echo "Version: $VER"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Flutter: $(flutter --version | head -n1)"
          } > dist/BUILD_INFO.txt
          cat dist/BUILD_INFO.txt

      - name: Upload AAB + APK as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # On a tag push, also create a GitHub Release so the APK is reachable from
      # the Releases page without logging in to Actions. Draft on purpose:
      # review, then publish. `--clobber` keeps re-runs idempotent.
      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "VoiceReader ${GITHUB_REF_NAME}" \
            --notes "Install on Android: download **VoiceReader.apk** below (NOT the .aab — that one is only for Google Play). Verify with SHA256SUMS.txt. If install fails with 'app not installed', uninstall the previous build first (debug keystore changes between builds). BUILD_INFO.txt shows commit & Flutter version." \
            dist/*.apk dist/*.aab dist/SHA256SUMS.txt dist/BUILD_INFO.txt \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.apk dist/*.aab dist/SHA256SUMS.txt dist/BUILD_INFO.txt --clobber

      # Publish to Play internal track once secrets are in place:
      # - uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.voicereader.app
      #     releaseFiles: dist/*.aab
      #     track: internal
